name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

env:
  GO_VERSION: "1.26.3"
  WAILS_VERSION: "v2.15.0"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: oven-sh/setup-bun@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libvips-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build .deb
        run: |
          export CGO_CFLAGS="-I$(pwd)/internal/cgo"
          chmod +x install/linux/build-deb.sh
          ./install/linux/build-deb.sh

      - name: Build AppImage
        run: |
          export CGO_CFLAGS="-I$(pwd)/internal/cgo"
          chmod +x install/linux/build-appimage.sh
          ./install/linux/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            build/bin/*.deb
            build/bin/*.AppImage

  # Windows-Build: coder/hnsw (Vektor-Index) does not support Windows

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: oven-sh/setup-bun@v2

      - name: Install system dependencies
        run: brew install vips create-dmg pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build .dmg (arm64)
        run: |
          export CGO_CFLAGS="-I$(pwd)/internal/cgo"
          chmod +x install/macos/build-macos.sh
          ./install/macos/build-macos.sh darwin/arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: build/bin/*.dmg

  release:
    needs: [linux, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
