name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

env:
  GO_VERSION: "1.26.3"
  WAILS_VERSION: "v2.15.0"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: oven-sh/setup-bun@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libvips-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build .deb
        run: |
          chmod +x install/linux/build-deb.sh
          ./install/linux/build-deb.sh

      - name: Build AppImage
        run: |
          chmod +x install/linux/build-appimage.sh
          ./install/linux/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            build/bin/*.deb
            build/bin/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: oven-sh/setup-bun@v2

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Prefer the runner's pre-installed MinGW-w64 GCC over git-bash's own
        shell: bash
        run: echo "/c/mingw64/bin" >> "$GITHUB_PATH"

      - name: Install pkg-config
        run: choco install pkgconfiglite -y

      - name: Install libvips (prebuilt Windows binaries)
        shell: bash
        run: |
          curl -L -o vips.zip https://github.com/libvips/build-win64-mxe/releases/download/v8.18.6/vips-dev-x64-web-8.18.6.zip
          unzip -q vips.zip -d vips
          VIPS_DIR="$(pwd)/vips/vips-dev-8.18"
          echo "PKG_CONFIG_PATH=$(cygpath -w "$VIPS_DIR/lib/pkgconfig")" >> "$GITHUB_ENV"
          echo "VIPS_BIN=$VIPS_DIR/bin" >> "$GITHUB_ENV"

      - name: Build Windows installer
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p build/bin
          cp "$VIPS_BIN"/*.dll build/bin/
          wails build -platform windows/amd64 -nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: build/bin/*installer*.exe

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: oven-sh/setup-bun@v2

      - name: Install system dependencies
        run: brew install vips create-dmg pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build .dmg (arm64)
        run: |
          chmod +x install/macos/build-macos.sh
          ./install/macos/build-macos.sh darwin/arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: build/bin/*.dmg

  macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: oven-sh/setup-bun@v2

      - name: Install system dependencies
        run: brew install vips create-dmg pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build .dmg (Intel)
        run: |
          chmod +x install/macos/build-macos.sh
          ./install/macos/build-macos.sh darwin/amd64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel-artifacts
          path: build/bin/*.dmg

  release:
    needs: [linux, windows, macos-arm64, macos-intel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
