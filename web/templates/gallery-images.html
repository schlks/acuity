{{if not .Images}}
	<div style="color: var(--text-muted); text-align: center; padding: 40px">
		This Gallery is empty
	</div>
{{else}}
	<div class="gallery-grid {{(getConfig).GridSize}}">
		{{range .Images}}
			{{template "image-card" .}}
		{{end}}
	</div>

	<div style="display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 40px; margin-bottom: 40px;">
		{{if gt .CurrentPage 1}}
			<button type="button" class="btn-primary" style="padding: 8px 16px; min-width: 44px; display: flex; justify-content: center;" 
				hx-get="/gallery/{{.GalleryName}}/images?page=1" 
				hx-include="#search-options-form"
				hx-target="#gallery-container"
				hx-swap="innerHTML show:top"
				title="First Page">
				<span class="material-symbols-outlined">keyboard_double_arrow_left</span>
			</button>
			<button type="button" class="btn-primary" style="padding: 8px 16px; display: flex; align-items: center; gap: 4px;" 
				hx-get="/gallery/{{.GalleryName}}/images?page={{.PrevPage}}" 
				hx-include="#search-options-form"
				hx-target="#gallery-container"
				hx-swap="innerHTML show:top">
				<span class="material-symbols-outlined">chevron_left</span> Back
			</button>
		{{end}}
		
		<span style="color: var(--text-muted);">Page {{.CurrentPage}}</span>

		{{if .HasNext}}
			<button type="button" class="btn-primary" style="padding: 8px 16px; display: flex; align-items: center; gap: 4px;" 
				hx-get="/gallery/{{.GalleryName}}/images?page={{.NextPage}}" 
				hx-include="#search-options-form"
				hx-target="#gallery-container"
				hx-swap="innerHTML show:top">
				Next <span class="material-symbols-outlined">chevron_right</span>
			</button>
			<button type="button" class="btn-primary" style="padding: 8px 16px; min-width: 44px; display: flex; justify-content: center;" 
				hx-get="/gallery/{{.GalleryName}}/images?page={{.LastPage}}" 
				hx-include="#search-options-form"
				hx-target="#gallery-container"
				hx-swap="innerHTML show:top"
				title="Last Page">
				<span class="material-symbols-outlined">keyboard_double_arrow_right</span>
			</button>
		{{end}}
	</div>
{{end}}
