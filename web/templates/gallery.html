<div style="display: flex; justify-content: center; margin-bottom: 40px;">
	<div style="width: 100%; max-width: 600px;">
		{{template "search-bar" (index . 2)}}
	</div>
</div>

<div style="margin-bottom: 32px; display: flex; flex-direction: column; gap: 4px;">
	<div style="display: flex; align-items: center; gap: 12px; flex-wrap: nowrap; overflow-x: visible;">
		<h2 style="margin: 0; color: var(--text); font-size: 1.8rem; white-space: nowrap;">{{index . 2}}</h2>
		<button class="btn-icon" hx-post="/gallery/{{index . 2}}/scan" title="Rescan Gallery" style="flex-shrink: 0;">
			<span class="material-symbols-outlined">refresh</span>
		</button>
		
		<!-- Selection Actions im Header -->
		<div x-show="selectedImages.length > 0" class="gallery-action-bar">
			<span style="font-size: 0.95rem; color: var(--primary); font-weight: 500; white-space: nowrap;"><span
                    x-text="selectedImages.length"></span> marked</span>
			
			<!-- Custom Toggle für Festplatten-Löschen -->
			<button class="btn-icon" 
				:style="deleteFromDisk ? 'background: var(--danger); color: white; border: 1px solid var(--danger);' : 'background: var(--bg-hover); border: 1px solid var(--border); color: var(--text-muted);'" 
				@click="deleteFromDisk = !deleteFromDisk" 
				style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 6px;
				padding: 6px;
				border-radius: 12px; font-size: 0.85rem; white-space: nowrap; width: 32px; height: 32px;"
				title="Also delete from disk">
				<span class="material-symbols-outlined" style="font-size: 1.1rem;">hard_drive</span>
			</button>

			<button class="btn-primary" style="background: var(--danger); border-color: #var(--danger); display: flex;
			align-items:
			center; justify-content: center; border-radius: 12px; padding: 6px; width: 32px; height: 32px;"
				hx-delete="/images"
				hx-vals='js:{"image_id": selectedImages.join(","), "delete_disk": deleteFromDisk}'
				hx-confirm="Wirklich löschen?"
				@click="setTimeout(() => selectedImages = [], 100)"
				title="Delete Selection">
				<span class="material-symbols-outlined" style="font-size: 1.2rem; margin: 0;">delete</span>
			</button>
			
			<button class="btn-icon" @click="selectedImages = []" title="Auswahl aufheben" style="background: var(--bg-hover); display: flex; align-items: center; justify-content: center; border-radius: 50%; padding: 4px;">
				<span class="material-symbols-outlined">close</span>
			</button>
		</div>
	</div>
	
	<span style="color: var(--text-muted); font-size: 0.9rem;">
		{{index . 1}} Images
	</span>
</div>


<div id="gallery-container" hx-get="/gallery/{{index . 2}}/images?page=1" hx-trigger="load, refresh-images from:body">
	<div class="gallery-grid">
		<div class="image-card skeleton" style="height: 250px; border: none;"></div>
		<div class="image-card skeleton" style="height: 320px; border: none;"></div>
		<div class="image-card skeleton" style="height: 200px; border: none;"></div>
		<div class="image-card skeleton" style="height: 400px; border: none;"></div>
		<div class="image-card skeleton" style="height: 280px; border: none;"></div>
		<div class="image-card skeleton" style="height: 220px; border: none;"></div>
		<div class="image-card skeleton" style="height: 350px; border: none;"></div>
		<div class="image-card skeleton" style="height: 290px; border: none;"></div>
	</div>
</div>

<span hx-get="/gallery/{{index . 2}}/progress" hx-trigger="load" hx-target="#sidebar-progress" hx-swap="innerHTML"></span>
