<div style="display: flex; justify-content: center; margin-bottom: 40px;">
	<div style="width: 100%; max-width: 600px;">
		{{template "search-bar" .Name}}
	</div>
</div>

<div style="margin-bottom: 32px; display: flex; flex-direction: column; gap: 4px;">
	<div style="display: flex; align-items: center; gap: 12px; flex-wrap: nowrap; overflow-x: visible;">
		<h2 style="margin: 0; color: var(--text); font-size: 1.8rem; white-space: nowrap;">{{if .Heading}}{{.Heading}}{{else}}{{.Name}}{{end}}</h2>
		<button class="btn-icon" @click="$refs.editGalleryDialog.showModal()" title="Edit Gallery" style="flex-shrink: 0;">
			<span class="material-symbols-outlined">edit</span>
		</button>
		<button class="btn-icon" hx-post="/gallery/{{.Name}}/scan" hx-swap="none" title="Rescan Gallery" style="flex-shrink: 0;" x-data="{ isScanning: $store.imports.some(i => i.name === '{{.Name}}') }" @update-imports.window="isScanning = $store.imports.some(i => i.name === '{{.Name}}')" @click="isScanning = true">
			<span class="material-symbols-outlined" :class="isScanning ? 'spin' : ''">refresh</span>
		</button>
		
		<!-- Selection Actions im Header -->
		<div x-show="selectedImages.length > 0" class="gallery-action-bar">
			<span style="font-size: 0.95rem; color: var(--info); font-weight: 500; white-space: nowrap;"><span
                    x-text="selectedImages.length"></span> marked</span>

			<button class="btn-primary" 
				style="background: var(--danger); border: 1px solid var(--danger); display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 6px; box-sizing: border-box; padding: 0;"
				hx-post="/images"
				x-bind:hx-vals="JSON.stringify({image_id: selectedImages.join(','), delete_disk: 'true', name: '{{.Name}}'})"
				hx-confirm="Are you sure you want to delete these images? This will also delete the files from your disk!"
				@click="setTimeout(() => selectedImages = [], 100)"
				title="Delete Selection">
				<span class="material-symbols-outlined" style="font-size: 1.2rem; margin: 0;">delete</span>
			</button>


			<button class="btn-icon" @click="selectedImages = []" title="Clear selection" style="background: var(--bg-hover); display: flex; align-items: center; justify-content: center; border-radius: 50%; padding: 4px;">
				<span class="material-symbols-outlined">close</span>
			</button>

            <button class="btn-icon" title="Invert Selection" style="flex-shrink: 0;" @click="document.querySelectorAll('#gallery-container img').forEach(img => { if(img.dataset.id) { if(selectedImages.includes(img.dataset.id)) selectedImages = selectedImages.filter(i => i !== img.dataset.id); else selectedImages.push(img.dataset.id); } })">
                <span class="material-symbols-outlined">swap_calls</span>
            </button>
		</div>
        
        <!-- Selection & Batch Action Buttons -->
		<button class="btn-icon" title="Select All (Page)" style="flex-shrink: 0;" @click="document.querySelectorAll('#gallery-container img').forEach(img => { if(img.dataset.id && !selectedImages.includes(img.dataset.id)) selectedImages.push(img.dataset.id) })">
			<span class="material-symbols-outlined">library_add_check</span>
		</button>
		<button class="btn-icon" title="Batch Actions" style="flex-shrink: 0;" @click="document.getElementById('batchActionDialog').showModal()">
			<span class="material-symbols-outlined">more_vert</span>
		</button>
	</div>
	
	<span id="gallery-image-count" hx-get="/gallery/{{.Name}}/count" hx-trigger="load, refresh-images from:body" style="color: var(--text-muted); font-size: 0.9rem;">
		Counting...
	</span>
</div>


<div x-data="{ loading: true, isScanning: $store.imports.some(i => i.name === '{{.Name}}') }" 
     @update-imports.window="isScanning = $store.imports.some(i => i.name === '{{.Name}}')"
     @htmx:before-request.window="if($event.detail.target.id === 'gallery-container' || $event.detail.target.id === 'main-content') loading = true"
     @htmx:after-request.window="if($event.detail.target.id === 'gallery-container') loading = false">
    
    <div id="gallery-skeleton" x-show="loading || isScanning">
        <div style="display: flex; justify-content: center; align-items: center; min-height: 400px; width: 100%; flex-direction: column; gap: 16px;">
            <svg class="md3-spinner" viewBox="0 0 48 48">
                <circle class="md3-spinner-path" cx="24" cy="24" r="18" fill="none" stroke-width="5"></circle>
            </svg>
            <div x-show="isScanning" style="display: none; color: var(--text-muted); font-size: 1.1rem; font-weight: 500;">Importing...</div>
        </div>
    </div>

    <div id="gallery-container" 
         x-show="!(loading || isScanning)"
         style="display: none;"
         hx-get="/gallery/{{.Name}}/images?page=1{{if .Folder}}&folder={{urlquery .Folder}}{{end}}" 
         hx-include="#search-options-form" 
         hx-trigger="load, refresh-images from:body, import-finished-{{.Name}} from:body">
    </div>
</div>

<!-- Edit Gallery Dialog -->
<dialog x-ref="editGalleryDialog" id="editGalleryDialog" @click="if ($event.target === $el) { $el.classList.add('closing'); setTimeout(() => { $el.close(); $el.classList.remove('closing'); }, 300); }">
	<h3 style="margin-bottom: 20px;">Edit Gallery Name</h3>
	<form hx-post="/gallery/{{.Name}}/edit" hx-target="#main-content">
		<div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px;">
			<div>
				<label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; display: block;">Gallery Name</label>
				<input class="input-clean" type="text" name="name" required value="{{.Name}}">
			</div>
		</div>
		<div style="display: flex; justify-content: flex-end; gap: 12px;">
			<button type="button" class="nav-item" style="width: auto;" @click="$refs.editGalleryDialog.classList.add('closing'); setTimeout(() => { $refs.editGalleryDialog.close(); $refs.editGalleryDialog.classList.remove('closing'); }, 300)">Cancel</button>
			<button type="submit" class="btn-primary" @click="$refs.editGalleryDialog.classList.add('closing'); setTimeout(() => { $refs.editGalleryDialog.close(); $refs.editGalleryDialog.classList.remove('closing'); }, 300)">Save</button>
		</div>
	</form>
</dialog>

<!-- Batch Action Dialog -->
<dialog id="batchActionDialog" x-ref="batchActionDialog" x-data="batchActionDialog()" @click="closeDialog($event, $el)">
	<h3 style="margin-bottom: 20px;">Batch Actions</h3>
	<form id="batchActionForm" hx-post="/gallery/batch" hx-target="#main-content" @submit="$el.closest('dialog').close()">
		
        <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px;">
            <div>
                <label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; display: block;">Selection Criteria</label>
                <select name="criteria" class="input-clean" style="width: 100%; padding: 8px; border-radius: 8px;" x-model="criteria">
                    <option value="selected" x-text="`Currently Selected (${selectedImages.length} images)`"></option>
                    <option value="all">Entire Gallery</option>
                    <option value="flag_1">Flag: Keep (Green)</option>
                    <option value="flag_0">Flag: None</option>
                    <option value="flag_-1">Flag: Reject (Red)</option>
                </select>
                <!-- Include selected IDs if criteria is 'selected' -->
                <input type="hidden" name="image_ids" x-bind:value="selectedImages.join(',')">
                <input type="hidden" name="source_gallery" value="{{.Name}}">
            </div>

            <div>
                <label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; display: block;">Action</label>
                <select name="batch_action" class="input-clean" style="width: 100%; padding: 8px; border-radius: 8px;" x-model="action">
                    <option value="move">Move to Gallery</option>
                    <option value="copy">Copy to Gallery</option>
                    <option value="delete">Delete</option>
                </select>
            </div>
        </div>

		<!-- Target Gallery Selector (Only for Move/Copy) -->
		<div x-show="action === 'move' || action === 'copy'" style="margin-bottom: 20px;">
            <input type="hidden" name="is_new" x-bind:value="isNew">
			<select name="name" class="input-clean" style="width: 100%; padding: 8px; border-radius: 8px;" @change="if($event.target.value === '__new__') { isNew = true; $event.target.value = ''; }">
				<option value="" disabled selected>Select a target gallery...</option>
				{{range .Galleries}}
					{{if ne .Name $.Name}} 
						<option value="{{.Name}}">{{.Name}}</option>
					{{end}}
				{{end}}
				<option value="__new__" style="color: var(--primary); font-weight: bold;">+ Create new gallery...</option>
			</select>
		</div>

		<div x-show="(action === 'move' || action === 'copy') && isNew" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
			<div>
				<label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; display: block;">New Gallery Name</label>
				<input class="input-clean" type="text" name="new_name" placeholder="E.g. Wallpapers" x-bind:required="isNew && (action === 'move' || action === 'copy')">
			</div>
			<div class="form-group" x-data="transferDialog()">
				<label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; display: block;">Absolute Path</label>
				<div style="display: flex; gap: 8px;">
					<input class="input-clean" type="text" name="path" x-model="transferPath" placeholder="/data/images/wallpapers" x-bind:required="isNew && (action === 'move' || action === 'copy')" style="flex-grow: 1;">
					<button type="button" class="btn-icon" @click="showTransferBrowser = true" hx-get="/api/browse?dir=/data&target=transferPath" hx-target="#transfer-browser-container">
						<span class="material-symbols-outlined">folder_open</span>
					</button>
				</div>
				<div x-show="showTransferBrowser" id="transfer-browser-container" style="margin-top: 16px;" @click.outside="showTransferBrowser = false">
				</div>
			</div>
			<button type="button" class="nav-item" style="font-size: 0.8rem; padding: 4px; width: auto; align-self: flex-start;" @click="isNew = false">
				<span class="material-symbols-outlined" style="font-size: 1rem;">arrow_back</span> Back to selection
			</button>
		</div>
		
		<div style="display: flex; justify-content: flex-end; gap: 12px;">
			<button type="button" class="nav-item" style="width: auto;" @click="let d = $el.closest('dialog'); d.classList.add('closing'); setTimeout(() => { d.close(); isNew = false; d.classList.remove('closing'); }, 300)">Cancel</button>
			<button type="submit" class="btn-primary" @click="setTimeout(() => { if(criteria === 'selected') selectedImages = []; isNew = false; }, 100); let d = $el.closest('dialog'); d.classList.add('closing'); setTimeout(() => { d.close(); d.classList.remove('closing'); }, 300)">Confirm</button>
		</div>
	</form>
</dialog>
