<div class="header">
    <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <span class="material-symbols-outlined" style="font-size: 2rem; color: var(--primary);">search</span>
            <div>
                <h2>Global Duplicates</h2>
                <div style="color: var(--text-muted); font-size: 0.9rem;">
                    Found {{len .Groups}} sets of duplicate images
                </div>
            </div>
        </div>
        
        <form hx-get="/gallery/global/duplicates" hx-target="#main-content" style="display: flex; align-items: center; gap: 8px;">
            <label for="threshold" style="color: var(--text-muted);">Max Distance:</label>
            <input type="number" id="threshold" name="threshold" value="{{.Threshold}}" step="0.05" min="0" max="2" class="input-clean" style="width: 80px;">
            <button type="submit" class="btn-primary">Update</button>
        </form>
    </div>
</div>

<div class="gallery" style="display: flex; flex-direction: column; gap: 32px; padding: 20px;">
    {{if not .Groups}}
    <div style="text-align: center; color: var(--text-muted); padding: 40px;">
        <span class="material-symbols-outlined" style="font-size: 48px; opacity: 0.5;">check_circle</span>
        <p>No duplicate pairs found with distance <= {{.Threshold}}.</p>
    </div>
    {{end}}

    {{range $index, $group := .Groups}}
    <div id="group-{{$index}}" class="duplicate-group" style="background: var(--bg-light); border: 1px solid var(--border); border-radius: 8px; padding: 16px;">
        <div style="margin-bottom: 12px; color: var(--text-muted); font-size: 0.9rem; border-bottom: 1px solid var(--border); padding-bottom: 8px;" x-data="{ idx: {{$index}} + 1 }">
            <strong x-text="'Duplicate Set ' + idx"></strong> ({{len $group}} images)
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
            
            {{range $img := $group}}
            <div class="image-card" tabindex="0" style="position: relative; border-radius: 4px; overflow: hidden;"
                 x-data="{ hover: false }" 
                 @mouseenter="hover = true" 
                 @mouseleave="hover = false">
                
                <img src="/image?path={{$img.Path}}" alt="Duplicate" data-id="{{$img.ID}}" style="width: 100%; height: 100%; object-fit: cover; cursor: pointer; display: block;"
                     @click="$dispatch('open-carousel', {id: '{{$img.ID}}', group: '#group-{{$index}}'})">
                
                <div x-show="hover" 
                     x-transition.opacity
                     style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.7); color: white; padding: 8px; font-size: 0.75rem; word-break: break-all; pointer-events: none;">
                    {{$img.Path}}
                </div>
            </div>
            {{end}}
            
        </div>
    </div>
    {{end}}
</div>
