<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="utf-8">
		<title>Acuity</title>
		<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
		<link rel="stylesheet" href="/static/css/style.css?v=3">
		
		<!-- HTMX & Alpine.js -->
		<script src="https://unpkg.com/htmx.org@1.9.10"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
		<script src="/static/js/keys.js"></script>
	</head>

	<body x-data="{ showDetailPanel: false, currentGallery: '', path: '', showBrowser: false, selectedImages: [], deleteFromDisk: false }"
		  @acuity-clear-selection.window="selectedImages = []"
		  @acuity-remove-selection.window="
			selectedImages = selectedImages.filter(x => x !== $event.detail.id);
			let cardImg = document.querySelector(`img[data-id='${$event.detail.id}']`);
			if (cardImg && cardImg.closest('.image-card')) {
				let card = cardImg.closest('.image-card');
				let group = card.closest('.duplicate-group');
				card.remove();
				if (group) {
					let remaining = group.querySelectorAll('.image-card').length;
					if (remaining < 2) {
						group.remove();
					} else {
						let countSpan = group.querySelector('.group-count');
						if (countSpan) countSpan.textContent = remaining;
					}
				}
			}
		  "
		  x-init="let saved = localStorage.getItem('openGallery'); if (saved) { currentGallery = saved; localStorage.removeItem('openGallery'); setTimeout(() => { htmx.ajax('GET', '/gallery/' + saved, {target: '#main-content'}) }, 100); }"
		  @load-gallery.window="localStorage.setItem('openGallery', $event.detail.value); window.location.reload()"
		  @acuity-toggle-select.window="let id = $event.detail.id; if(selectedImages.includes(id)) { selectedImages = selectedImages.filter(x => x !== id) } else { selectedImages.push(id) }"
		  @acuity-toggle-disk-delete.window="deleteFromDisk = !deleteFromDisk">
		<div class="layout-wrapper">
			<aside class="sidebar-left">
				<a href="/" style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; text-decoration: none; cursor: pointer;">
					<img src="/static/logo.svg" alt="Acuity Logo" style="width: 32px; height: 32px;">
					<h1 style="color: var(--primary);">Acuity</h1>
				</a>
				<hr>
				<nav style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1;">
					<div x-data="{ open: true }">
						<button class="nav-item" tabindex="0" @click="open = !open">
							<span class="material-symbols-outlined">grid_view</span> Galleries
							<span class="material-symbols-outlined" style="margin-left: auto; font-size: 1rem;" x-text="open ? 'expand_less' : 'expand_more'">expand_less</span>
						</button>
						<div x-show="open" style="padding-left: 28px; display: flex; flex-direction: column; gap: 4px; margin-top: 4px;" x-transition>
							{{range .Galleries}}
							<div style="position: relative; display: flex; align-items: center;" x-data="{ hovered: false }" @mouseenter="hovered = true" @mouseleave="hovered = false">
								<button class="nav-item" tabindex="0" :class="{ 'active': currentGallery === '{{.Name}}' }" @click="currentGallery = '{{.Name}}'" hx-get="/gallery/{{.Name}}" hx-target="#main-content" style="padding-right: 40px; flex-grow: 1;">
									<span class="material-symbols-outlined" style="font-size: 1rem;">folder</span> {{.Name}}
								</button>
								<button class="btn-icon-danger" x-show="hovered" x-transition style="position: absolute; right: 8px; z-index: 10;"
										hx-delete="/gallery/{{.Name}}" 
										hx-confirm="Do you really want to delete '{{.Name}}'?"
										hx-target="closest div" 
										hx-swap="outerHTML">
									<span class="material-symbols-outlined" style="font-size: 1rem;">delete</span>
								</button>
							</div>
							{{end}}

							<button class="nav-item" @click="document.getElementById('addDialog').showModal()" style="padding: 6px 12px; font-size: 0.9rem; color: var(--primary);">
								<span class="material-symbols-outlined" style="font-size: 1rem;">add</span> Add Gallery
							</button>
						</div>
					</div>
					<div style="position: relative; display: flex; align-items: center;" x-data="{ hovered: false }" @mouseenter="hovered = true" @mouseleave="hovered = false">
						<button class="nav-item" :class="{ 'active': currentGallery === 'duplicates' }" @click="currentGallery = 'duplicates'" hx-get="/gallery/global/duplicates" hx-target="#main-content">
							<span class="material-symbols-outlined">search</span> Duplicates
						</button>
					</div>
					<div id="sidebar-progress-ui" x-data="{ imports: [] }" @update-imports.window="imports = $event.detail" style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
						<template x-if="imports.length > 0">
							<div>
								<h3 style="color: var(--text-muted)">Imports</h3>
								<hr>
							</div>
						</template>
						<template x-for="imp in imports" :key="imp.name">
							<div style="padding: 16px; background: var(--bg-light); border-radius: 8px; border: 1px solid var(--border); margin: 16px 0;">
								<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
									<div style="display: flex; align-items: center; gap: 8px;">
										<!--<span class="material-symbols-outlined" style="font-size: 1.1rem; animation: spin 2s linear infinite; color: var(--primary); display: flex; align-items:
										center; justify-content: center; width: 1.1rem; height: 1.1rem; transform-origin: center;">sync</span>-->
										<span style="font-weight: 500; color: var(--text);" x-text="imp.name"></span>
									</div>
									<div style="display: flex; align-items: center; gap: 12px;">
										<span style="color: var(--text-muted); font-size: 0.9rem;" x-text="imp.current + ' / ' + imp.expected"></span>
										<button style="background: none; border: none; padding: 4px; cursor: pointer; color: var(--error);" 
												@click="fetch('/gallery/' + imp.name + '/scan', { method: 'DELETE' })" title="Cancel Import">
											<span class="material-symbols-outlined" style="font-size: 1.2rem;">cancel</span>
										</button>
									</div>
								</div>
								<div class="md3-linear-progress"></div>
							</div>
						</template>
					</div>
					<div id="sidebar-progress" hx-get="/api/progress" hx-trigger="load, check-progress from:body" style="display: none;"></div>

                    <hr>
					<button class="nav-item" hx-get="/settings" hx-target="body" hx-swap="beforeend">
						<span class="material-symbols-outlined">settings</span> Settings
					</button>
				</nav>
			</aside>

			<main class="main-area" style="padding: 32px; overflow-y: auto;">
				<div id="main-content" style="min-height: 100%;">
					<div style="min-height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 20vh;">
						<h2 style="font-weight: normal; margin-bottom: 30px; color: var(--text-muted);">Search in your Images</h2>
						<div style="width: 100%; max-width: 600px;">
							{{template "search-bar" "global"}}
						</div>
						
						<!-- Hier landen die Suchergebnisse der Startseite -->
						<div id="gallery" class="gallery-grid" style="width: 100%; padding-top: 40px; align-self: flex-start;"></div>
					</div>
				</div>

				<aside class="sidebar-right" :class="{ 'is-open': showDetailPanel }" @click.outside="showDetailPanel = false">
					<button class="btn-icon" @click="showDetailPanel = false" style="align-self: flex-end; margin-bottom: 20px;">
						<span class="material-symbols-outlined">close</span>
					</button>
					<div id="info-container" style="overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column;">
						<!-- Hier lädt HTMX die Infos rein -->
					</div>
				</aside>
			</main>
		</div>



		<!-- Natives HTML Dialog -->
		<dialog x-ref="addDialog" id="addDialog" @click="if ($event.target === $el) { $el.classList.add('closing'); setTimeout(() => { $el.close(); $el.classList.remove('closing'); }, 300); }">
			<h3 style="margin-bottom: 20px;">Add a new Gallery</h3>
			<form id="form-id" hx-post="/gallery" hx-target="#main-content">
				<div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px;">
					<div>
						<label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; display: block;">Gallery Name</label>
						<input class="input-clean" type="text" name="name" required placeholder="Wallpaper">
					</div>
					<div class="form-group">
						<label>Absolute Gallery Path</label>

						<!-- Alpine x-model bindet die Eingabe an unsere Variable 'path' -->
						<div style="display: flex; gap: 8px;">
							<input class="input-clean" type="text" name="path" x-model="path" required style="flex-grow: 1;" placeholder="/data/wallpaper">

							<!-- Klick öffnet den Browser und lädt das Root-Verzeichnis via HTMX -->
							<button type="button" class="btn-icon" @click="showBrowser = true" hx-get="/api/browse?dir=/" hx-target="#file-browser-container">
								<span class="material-symbols-outlined">folder_open</span>
							</button>
						</div>

						<!-- Hier wird das "file-browser" Template reingeladen, wenn showBrowser = true ist -->
						<div x-show="showBrowser" id="file-browser-container" style="margin-top: 16px;" @click.outside="showBrowser = false">
						</div>
					</div>
				</div>
				<div style="display: flex; justify-content: flex-end; gap: 12px;">
					<button type="button" class="nav-item" style="width: auto;" @click="$refs.addDialog.classList.add('closing'); setTimeout(() => { $refs.addDialog.close(); $refs.addDialog.classList.remove('closing'); }, 300)">Cancel</button>
					<button type="submit" class="btn-primary" @click="$refs.addDialog.classList.add('closing'); setTimeout(() => { $refs.addDialog.close(); $refs.addDialog.classList.remove('closing'); }, 300)">Save</button>
				</div>
			</form>
		</dialog>

		<!-- Fullscreen Carousel -->
		<dialog x-ref="carouselDialog" class="carousel-modal" x-data="{
			images: [],
			currentIndex: 0,
			showInfo: false,
			scale: 1,
			panX: 0,
			panY: 0,
			isDragging: false,
			startX: 0,
			startY: 0,
			isLoading: false,
			
			init() {
				this.$watch('currentIndex', () => { this.isLoading = true; });
			},
			
			resetZoom() {
				this.scale = 1;
				this.panX = 0;
				this.panY = 0;
			},
			
			open(id, groupSelector) {
				const selector = groupSelector ? `${groupSelector} .image-card img` : '#main-content .image-card img';
				const imageEls = Array.from(document.querySelectorAll(selector));
				this.images = imageEls.map(img => ({ src: img.src, id: img.dataset.id, rating: parseInt(img.dataset.rating) || 0, flag: parseInt(img.dataset.flag) || 0 }));
				
				const idx = this.images.findIndex(img => img.id === id);
				this.currentIndex = idx !== -1 ? idx : 0;
				
				this.resetZoom();
				this.showInfo = false;
				document.querySelector('.carousel-modal').showModal();
				document.body.style.overflow = 'hidden';
			},
			
			close() {
				document.querySelector('.carousel-modal').close();
				document.body.style.overflow = '';
			},
			
			next() {
				if (this.currentIndex < this.images.length - 1) {
					this.currentIndex++;
					this.resetZoom();
					if(this.showInfo) {
						htmx.ajax('GET', '/image/' + this.images[this.currentIndex].id, {target: '#carousel-info-container'});
					}
				} else {
					const nextBtn = document.getElementById('next-page-btn');
					if (nextBtn) {
						this.isLoading = true;
						sessionStorage.setItem('acuity-focus', 'first');
						sessionStorage.setItem('acuity-carousel-reopen', 'first');
						nextBtn.click();
					}
				}
			},
			
			prev() {
				if (this.currentIndex > 0) {
					this.currentIndex--;
					this.resetZoom();
					if(this.showInfo) {
						htmx.ajax('GET', '/image/' + this.images[this.currentIndex].id, {target: '#carousel-info-container'});
					}
				} else {
					const prevBtn = document.getElementById('prev-page-btn');
					if (prevBtn) {
						this.isLoading = true;
						sessionStorage.setItem('acuity-focus', 'last');
						sessionStorage.setItem('acuity-carousel-reopen', 'last');
						prevBtn.click();
					}
				}
			},
			clampPan(pan, clientSize, windowSize) {
				const scaledSize = clientSize * this.scale;
				if (scaledSize <= windowSize) return 0;
				const maxPan = (scaledSize - windowSize) / 2;
				return Math.max(-maxPan, Math.min(maxPan, pan));
			},
			
			handleWheel(e) {
				e.preventDefault();
				if (this.isDragging) return;
				
				const delta = e.deltaY > 0 ? -0.1 : 0.1;
				const newScale = Math.max(1, Math.min(this.scale * (1 + delta), 50));
				
				const img = this.$el.querySelector('.carousel-image');
				if (!img) return;

				const mouseX = e.clientX - (window.innerWidth / 2);
				const mouseY = e.clientY - (window.innerHeight / 2);
				
				const scaleRatio = newScale / this.scale;
				
				let newPanX = mouseX - (mouseX - this.panX) * scaleRatio;
				let newPanY = mouseY - (mouseY - this.panY) * scaleRatio;
				
				this.scale = newScale;
				
				if (this.scale === 1) {
					this.panX = 0;
					this.panY = 0;
				} else {
					this.panX = this.clampPan(newPanX, img.clientWidth, window.innerWidth);
					this.panY = this.clampPan(newPanY, img.clientHeight, window.innerHeight);
				}
			},
			
			startDrag(e) {
				if (this.scale <= 1) return;
				e.preventDefault();
				this.isDragging = true;
				this.startX = e.clientX - this.panX;
				this.startY = e.clientY - this.panY;
			},
			
			doDrag(e) {
				if (!this.isDragging) return;
				
				let newPanX = e.clientX - this.startX;
				let newPanY = e.clientY - this.startY;
				
				const img = this.$el.querySelector('.carousel-image');
				if (img) {
					this.panX = this.clampPan(newPanX, img.clientWidth, window.innerWidth);
					this.panY = this.clampPan(newPanY, img.clientHeight, window.innerHeight);
				} else {
					this.panX = newPanX;
					this.panY = newPanY;
				}
			},
			
			stopDrag() {
				this.isDragging = false;
			},
			
			deleteCurrent() {
				if(!this.images[this.currentIndex]) return;
				let img = this.images[this.currentIndex];
				let isDisk = document.querySelector('body').__x?.$data?.deleteFromDisk;
				fetch('/image/' + img.id + '?disk=' + !!isDisk, {method: 'DELETE'}).then(() => {
					let prevId = img.id;
					window.dispatchEvent(new CustomEvent('acuity-remove-selection', {detail: {id: prevId}}));
					
					this.images = this.images.filter(i => i.id !== prevId);
					if(this.images.length === 0) {
						const nextBtn = document.getElementById('next-page-btn');
						if (nextBtn) {
							this.isLoading = true;
							sessionStorage.setItem('acuity-focus', 'first');
							sessionStorage.setItem('acuity-carousel-reopen', 'first');
							nextBtn.click();
						} else {
							this.close();
						}
					} else {
						if (this.currentIndex >= this.images.length) {
							const nextBtn = document.getElementById('next-page-btn');
							if (nextBtn) {
								this.isLoading = true;
								sessionStorage.setItem('acuity-focus', 'first');
								sessionStorage.setItem('acuity-carousel-reopen', 'first');
								nextBtn.click();
								return;
							} else {
								this.currentIndex = this.images.length - 1;
							}
						}
						this.isLoading = true;
						if(this.showInfo) {
							htmx.ajax('GET', '/image/' + this.images[this.currentIndex].id, {target: '#carousel-info-container'});
						}
						if(document.querySelector('body').__x?.$data?.showDetailPanel) {
							htmx.ajax('GET', '/image/' + this.images[this.currentIndex].id, {target: '#image-detail-container'});
						}
					}
				});
			}
		}"
		@open-carousel.window="open($event.detail.id, $event.detail.group)"
		@close-carousel.window="close()"
		@acuity-escape.window="if(showInfo) showInfo = false; else close()"
		@acuity-space-carousel.window="
			if (document.querySelector('.carousel-modal').open) {
				$dispatch('acuity-toggle-select-carousel');
			}
		"
		@acuity-next.window="
			if(document.querySelector('.carousel-modal:not(.culling)').open) {
				if (scale > 1) { 
					const img = $el.querySelector('.carousel-image');
					if (img) panX = clampPan(panX - 50, img.clientWidth, window.innerWidth);
				} else { next(); }
			}
		"
		@acuity-prev.window="
			if(document.querySelector('.carousel-modal:not(.culling)').open) {
				if (scale > 1) { 
					const img = $el.querySelector('.carousel-image');
					if (img) panX = clampPan(panX + 50, img.clientWidth, window.innerWidth);
				} else { prev(); }
			}
		"
		@acuity-arrow-up.window="
			if(document.querySelector('.carousel-modal:not(.culling)').open && scale > 1) {
				const img = $el.querySelector('.carousel-image');
				if (img) panY = clampPan(panY + 50, img.clientHeight, window.innerHeight);
			}
		"
		@acuity-arrow-down.window="
			if(document.querySelector('.carousel-modal:not(.culling)').open && scale > 1) {
				const img = $el.querySelector('.carousel-image');
				if (img) panY = clampPan(panY - 50, img.clientHeight, window.innerHeight);
			}
		"
		@acuity-zoom-in.window="
			if(document.querySelector('.carousel-modal:not(.culling)').open) {
				scale = Math.min(scale * 1.5, 50);
			}
		"
		@acuity-zoom-out.window="
			if(document.querySelector('.carousel-modal:not(.culling)').open) {
				scale = Math.max(scale / 1.5, 1);
				if(scale === 1) resetZoom();
			}
		"
		@acuity-zoom-reset.window="
			if(document.querySelector('.carousel-modal:not(.culling)').open) resetZoom();
		"
		@acuity-toggle-info.window="if(document.querySelector('.carousel-modal').open) { showInfo = !showInfo; if(showInfo && images[currentIndex]) { htmx.ajax('GET', '/image/' + images[currentIndex].id, {target: '#carousel-info-container'}) } }"
		@acuity-toggle-select-carousel.window="if(document.querySelector('.carousel-modal').open && images[currentIndex]) { let id = images[currentIndex].id; if(selectedImages.includes(id)) { selectedImages = selectedImages.filter(x => x !== id) } else { selectedImages.push(id) } }"
		@acuity-rate-carousel.window="if(document.querySelector('.carousel-modal').open && images[currentIndex]) { let img = images[currentIndex]; let rating = $event.detail.rating; fetch('/image/' + img.id, {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: 'rating=' + rating}).then(() => { window.dispatchEvent(new CustomEvent('rating-updated', {detail: {id: img.id, rating: rating}})); if(showInfo) htmx.ajax('GET', '/image/' + img.id, {target: '#carousel-info-container'}); if(document.querySelector('body').__x?.$data?.showDetailPanel) htmx.ajax('GET', '/image/' + img.id, {target: '#image-detail-container'}); }); }"
		@acuity-flag-carousel.window="if(document.querySelector('.carousel-modal').open && images[currentIndex]) { let img = images[currentIndex]; let newFlag = 0; if ($event.detail.type === 'keep') { newFlag = img.flag === 1 ? 0 : 1; } else if ($event.detail.type === 'reject') { newFlag = img.flag === -1 ? 0 : -1; }; fetch('/image/' + img.id + '/flag', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: 'flag=' + newFlag}).then(() => { window.dispatchEvent(new CustomEvent('flag-updated', {detail: {id: img.id, flag: newFlag}})); if(showInfo) htmx.ajax('GET', '/image/' + img.id, {target: '#carousel-info-container'}); if(document.querySelector('body').__x?.$data?.showDetailPanel) htmx.ajax('GET', '/image/' + img.id, {target: '#image-detail-container'}); }); }"
		@acuity-delete-carousel.window="if(document.querySelector('.carousel-modal').open) deleteCurrent()"
		@acuity-search-similar.window="if(document.querySelector('.carousel-modal').open && images[currentIndex]) { htmx.ajax('GET', '/gallery/global/duplicates', {target: '#main-content', values: {imageID: images[currentIndex].id, returnTo: currentGallery}}); close(); showDetailPanel = false; }"
		@rating-updated.window="let img = images.find(i => i.id === $event.detail.id); if(img) img.rating = $event.detail.rating;"
		@flag-updated.window="let img = images.find(i => i.id === $event.detail.id); if(img) img.flag = $event.detail.flag;"
		@acuity-copy.window="
			if (document.querySelector('.carousel-modal').open && images[currentIndex]) {
				if (!selectedImages.includes(images[currentIndex].id)) selectedImages.push(images[currentIndex].id);
			} else if (document.activeElement && document.activeElement.classList.contains('image-card')) {
				let img = document.activeElement.querySelector('img');
				if (img && img.dataset.id && !selectedImages.includes(img.dataset.id)) selectedImages.push(img.dataset.id);
			}
			if (selectedImages.length > 0) {
				let td = document.getElementById('transferDialog');
				if (td) { document.getElementById('transferAction').value = 'copy'; td.showModal(); }
			}
		"
		@acuity-move.window="
			if (document.querySelector('.carousel-modal').open && images[currentIndex]) {
				if (!selectedImages.includes(images[currentIndex].id)) selectedImages.push(images[currentIndex].id);
			} else if (document.activeElement && document.activeElement.classList.contains('image-card')) {
				let img = document.activeElement.querySelector('img');
				if (img && img.dataset.id && !selectedImages.includes(img.dataset.id)) selectedImages.push(img.dataset.id);
			}
			if (selectedImages.length > 0) {
				let td = document.getElementById('transferDialog');
				if (td) { document.getElementById('transferAction').value = 'move'; td.showModal(); }
			}
		"
		@htmx:after-settle.window="
			let reopenAction = sessionStorage.getItem('acuity-carousel-reopen');
			if (reopenAction && document.querySelector('.carousel-modal:not(.culling)').open) {
				sessionStorage.removeItem('acuity-carousel-reopen');
				const imageEls = Array.from(document.querySelectorAll('#main-content .image-card img'));
				if (imageEls.length > 0) {
					images = imageEls.map(img => ({ src: img.src, id: img.dataset.id, rating: parseInt(img.dataset.rating) || 0, flag: parseInt(img.dataset.flag) || 0 }));
					currentIndex = (reopenAction === 'last') ? images.length - 1 : 0;
					resetZoom();
					if(showInfo) htmx.ajax('GET', '/image/' + images[currentIndex].id, {target: '#carousel-info-container'});
				} else {
					close();
				}
			}
		">
		
			<!-- Toolbar -->
			<div class="carousel-toolbar" x-show="images.length > 0">
				<div class="carousel-action" x-show="images[currentIndex]?.flag === 1" style="padding: 0 12px; width: auto; pointer-events: none;">
					<span class="material-symbols-outlined icon-filled" style="color: #2ecc71; font-size: 1.2rem;">check_circle</span>
				</div>
				<div class="carousel-action" x-show="images[currentIndex]?.flag === -1" style="padding: 0 12px; width: auto; pointer-events: none;">
					<span class="material-symbols-outlined icon-filled" style="color: #e74c3c; font-size: 1.2rem;">cancel</span>
				</div>
				<div class="carousel-action" x-show="images[currentIndex]?.rating > 0" style="padding: 0 12px; width: auto; gap: 4px; font-weight: bold; pointer-events: none;">
					<span class="material-symbols-outlined icon-filled" style="color: var(--primary); font-size: 1.2rem;">star</span>
					<span x-text="images[currentIndex]?.rating"></span>
				</div>
				<button class="carousel-action" title="Select image" @click="let id = images[currentIndex].id; if(selectedImages.includes(id)) { selectedImages = selectedImages.filter(x => x !== id) } else { selectedImages.push(id) }" :style="selectedImages.includes(images[currentIndex].id) ? 'color: var(--primary);' : ''">
					<span class="material-symbols-outlined" x-text="selectedImages.includes(images[currentIndex].id) ? 'check_circle' : 'radio_button_unchecked'"></span>
				</button>
				<button class="carousel-action" title="Details" @click="showInfo = !showInfo; if(showInfo) { htmx.ajax('GET', '/image/' + images[currentIndex].id, {target: '#carousel-info-container'}) }">
					<span class="material-symbols-outlined">info</span>
				</button>
				<button class="carousel-action" title="Close fullscreen" @click="close()">
					<span class="material-symbols-outlined">close</span>
				</button>
			</div>
			
			<!-- Info Overlay -->
			<div x-show="showInfo" style="position: absolute; right: 20px; top: 70px; width: 350px; background: var(--bg-light); border: 1px solid var(--border); border-radius: 8px; padding: 16px; z-index: 10; max-height: calc(100vh - 100px); overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5);" x-transition>
				<div id="carousel-info-container"></div>
			</div>
			
			<div class="carousel-content" @click.self="if(showInfo) showInfo = false; else close()" @wheel.prevent="handleWheel">
				<button class="btn-icon carousel-nav prev" @click="prev()" x-show="currentIndex > 0">
					<span class="material-symbols-outlined">chevron_left</span>
				</button>
				
				<template x-for="img in [images[currentIndex]]" :key="img ? img.id : 'empty'">
					<img x-show="img" :src="img?.src" class="carousel-image" 
						x-transition:enter="carousel-fade-active"
						x-transition:enter-start="carousel-fade-from"
						x-transition:enter-end="carousel-fade-to"
						x-transition:leave="carousel-fade-active"
						x-transition:leave-start="carousel-fade-to"
						x-transition:leave-end="carousel-fade-from"
						@load="isLoading = false"
						@click.stop=""
						@dblclick.stop="resetZoom()"
						@mousedown="startDrag"
						@mousemove.window="doDrag"
						@mouseup.window="stopDrag"
						:style="`transform: translate(${panX}px, ${panY}px) scale(${scale}); cursor: ${scale > 1 ? (isDragging ? 'grabbing' : 'grab') : 'default'}`">
				</template>
				
				<div x-show="isLoading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 5;">
					<svg class="md3-spinner" viewBox="0 0 48 48">
						<circle class="md3-spinner-path" cx="24" cy="24" r="18" fill="none" stroke-width="5"></circle>
					</svg>
				</div>
				
				<button class="btn-icon carousel-nav next" @click="next()" x-show="currentIndex < images.length - 1">
					<span class="material-symbols-outlined">chevron_right</span>
				</button>
			</div>
			
			<div class="carousel-counter">
				<span x-text="currentIndex + 1"></span> / <span x-text="images.length"></span>
			</div>
		</dialog>

	<!-- Dedicated Culling Modal -->
	<dialog id="culling-modal" class="carousel-modal culling" x-data="{
		images: [],
		currentIndex: 0,
		isLoading: false,
		scale: 1,
		panX: 0,
		panY: 0,
		isDragging: false,
		startX: 0,
		startY: 0,
		
		init() {
			this.$watch('currentIndex', () => { this.isLoading = true; this.resetZoom(); });
		},
		
		resetZoom() {
			this.scale = 1;
			this.panX = 0;
			this.panY = 0;
			this.isDragging = false;
		},
		
		clampPan(pan, clientSize, windowSize) {
			const scaledSize = clientSize * this.scale;
			if (scaledSize <= windowSize) return 0;
			const maxPan = (scaledSize - windowSize) / 2;
			return Math.max(-maxPan, Math.min(maxPan, pan));
		},
		
		handleWheel(e) {
			e.preventDefault();
			if (this.isDragging) return;
			
			const delta = e.deltaY > 0 ? -0.1 : 0.1;
			const newScale = Math.max(1, Math.min(this.scale * (1 + delta), 50));
			
			const img = this.$el.querySelector('.carousel-image');
			if (!img) return;

			const mouseX = e.clientX - (window.innerWidth / 2);
			const mouseY = e.clientY - (window.innerHeight / 2);
			
			const scaleRatio = newScale / this.scale;
			
			let newPanX = mouseX - (mouseX - this.panX) * scaleRatio;
			let newPanY = mouseY - (mouseY - this.panY) * scaleRatio;
			
			this.scale = newScale;
			
			if (this.scale === 1) {
				this.panX = 0;
				this.panY = 0;
			} else {
				this.panX = this.clampPan(newPanX, img.clientWidth, window.innerWidth);
				this.panY = this.clampPan(newPanY, img.clientHeight, window.innerHeight);
			}
		},
		
		startDrag(e) {
			if (this.scale <= 1) return;
			e.preventDefault();
			this.isDragging = true;
			this.startX = e.clientX - this.panX;
			this.startY = e.clientY - this.panY;
		},
		
		doDrag(e) {
			if (!this.isDragging) return;
			
			let newPanX = e.clientX - this.startX;
			let newPanY = e.clientY - this.startY;
			
			const img = this.$el.querySelector('.carousel-image');
			if (img) {
				this.panX = this.clampPan(newPanX, img.clientWidth, window.innerWidth);
				this.panY = this.clampPan(newPanY, img.clientHeight, window.innerHeight);
			} else {
				this.panX = newPanX;
				this.panY = newPanY;
			}
		},
		
		stopDrag() {
			this.isDragging = false;
		},
		
		open() {
			const imageEls = Array.from(document.querySelectorAll('#main-content .image-card img'));
			if (imageEls.length > 0) {
				let lastId = null;
				if (this.images.length > 0 && this.images[this.currentIndex]) {
					lastId = this.images[this.currentIndex].id;
				}
				
				this.images = imageEls.map(img => ({ src: img.src, id: img.dataset.id }));
				
				let foundIdx = -1;
				if (lastId) {
					foundIdx = this.images.findIndex(img => img.id === lastId);
				}
				
				this.currentIndex = foundIdx !== -1 ? foundIdx : 0;
				this.resetZoom();
				document.getElementById('culling-modal').showModal();
				document.body.style.overflow = 'hidden';
			}
		},
		close() {
			document.getElementById('culling-modal').close();
			document.body.style.overflow = '';
		},
		flag(val) {
			if(this.images.length === 0) return;
			let img = this.images[this.currentIndex];
			fetch('/image/' + img.id + '/flag', { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: 'flag=' + val })
				.then(() => {
					let flagBadge = document.getElementById('flag-badge-' + img.id);
					if (flagBadge) {
						flagBadge.outerHTML = '<div id=\'flag-badge-' + img.id + '\' hx-swap-oob=\'true\' style=\'position: absolute; top: 8px; left: 8px; z-index: 10;\'>' + (val === 1 ? '<span class=\'material-symbols-outlined icon-filled\' style=\'color: #2ecc71; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));\'>check_circle</span>' : (val === -1 ? '<span class=\'material-symbols-outlined icon-filled\' style=\'color: #e74c3c; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));\'>cancel</span>' : '')) + '</div>';
					}
					this.next();
				});
		},
		
		next() {
			if (this.currentIndex < this.images.length - 1) {
				this.currentIndex++;
			} else {
				const nextBtn = document.getElementById('next-page-btn');
				if (nextBtn) {
					this.isLoading = true;
					sessionStorage.setItem('acuity-focus', 'first');
					sessionStorage.setItem('acuity-culling-reopen', 'first');
					nextBtn.click();
				}
			}
		},
		
		prev() {
			if (this.currentIndex > 0) {
				this.currentIndex--;
			} else {
				const prevBtn = document.getElementById('prev-page-btn');
				if (prevBtn) {
					this.isLoading = true;
					sessionStorage.setItem('acuity-focus', 'last');
					sessionStorage.setItem('acuity-culling-reopen', 'last');
					prevBtn.click();
				}
			}
		},
		
		deleteCurrent() {
			if(!this.images[this.currentIndex]) return;
			let img = this.images[this.currentIndex];
			let isDisk = document.querySelector('body').__x?.$data?.deleteFromDisk;
			fetch('/image/' + img.id + '?disk=' + !!isDisk, {method: 'DELETE'}).then(() => {
				let prevId = img.id;
				window.dispatchEvent(new CustomEvent('acuity-remove-selection', {detail: {id: prevId}}));
				
				this.images = this.images.filter(i => i.id !== prevId);
				if(this.images.length === 0) {
					const nextBtn = document.getElementById('next-page-btn');
					if (nextBtn) {
						this.isLoading = true;
						sessionStorage.setItem('acuity-focus', 'first');
						sessionStorage.setItem('acuity-culling-reopen', 'first');
						nextBtn.click();
					} else {
						this.close();
					}
				} else {
					if (this.currentIndex >= this.images.length) {
						const nextBtn = document.getElementById('next-page-btn');
						if (nextBtn) {
							this.isLoading = true;
							sessionStorage.setItem('acuity-focus', 'first');
							sessionStorage.setItem('acuity-culling-reopen', 'first');
							nextBtn.click();
							return;
						} else {
							this.currentIndex = this.images.length - 1;
						}
					}
					this.isLoading = true;
				}
			});
		}
	}" 
	@acuity-start-culling.window="open()"
	@acuity-space-carousel.window="if(document.getElementById('culling-modal').open) flag(1)"
	@acuity-backspace-carousel.window="if(document.getElementById('culling-modal').open) flag(-1)"
	@acuity-escape.window="if(document.getElementById('culling-modal').open) close()"
	@acuity-next.window="
		if(document.getElementById('culling-modal').open) {
			if (scale > 1) { 
				const img = $el.querySelector('.carousel-image');
				if (img) panX = clampPan(panX - 50, img.clientWidth, window.innerWidth);
			} else { next(); }
		}
	"
	@acuity-prev.window="
		if(document.getElementById('culling-modal').open) {
			if (scale > 1) { 
				const img = $el.querySelector('.carousel-image');
				if (img) panX = clampPan(panX + 50, img.clientWidth, window.innerWidth);
			} else { prev(); }
		}
	"
	@acuity-arrow-up.window="
		if(document.getElementById('culling-modal').open && scale > 1) {
			const img = $el.querySelector('.carousel-image');
			if (img) panY = clampPan(panY + 50, img.clientHeight, window.innerHeight);
		}
	"
	@acuity-arrow-down.window="
		if(document.getElementById('culling-modal').open && scale > 1) {
			const img = $el.querySelector('.carousel-image');
			if (img) panY = clampPan(panY - 50, img.clientHeight, window.innerHeight);
		}
	"
	@acuity-zoom-in.window="
		if(document.getElementById('culling-modal').open) {
			scale = Math.min(scale * 1.5, 50);
		}
	"
	@acuity-zoom-out.window="
		if(document.getElementById('culling-modal').open) {
			scale = Math.max(scale / 1.5, 1);
			if(scale === 1) resetZoom();
		}
	"
	@acuity-zoom-reset.window="
		if(document.getElementById('culling-modal').open) resetZoom();
	"
	@acuity-delete-carousel.window="if(document.getElementById('culling-modal').open) deleteCurrent()"
	@htmx:after-settle.window="
		let reopenAction = sessionStorage.getItem('acuity-culling-reopen');
		if (reopenAction && document.getElementById('culling-modal').open) {
			sessionStorage.removeItem('acuity-culling-reopen');
			const imageEls = Array.from(document.querySelectorAll('#main-content .image-card img'));
			if (imageEls.length > 0) {
				images = imageEls.map(img => ({ src: img.src, id: img.dataset.id }));
				currentIndex = (reopenAction === 'last') ? images.length - 1 : 0;
			} else {
				close();
			}
		}
	"
	>
		<!-- Toolbar (Matching Design Language) -->
		<div class="carousel-toolbar" x-show="images.length > 0">
			<div class="carousel-action" style="padding: 0 12px; width: auto; font-weight: bold; pointer-events: none;">
				<span class="material-symbols-outlined icon-filled" style="color: var(--primary);">bolt</span>
				Culling Mode
			</div>
			<div style="flex: 1"></div>
			<button class="carousel-action" title="Close fullscreen" @click="close()">
				<span class="material-symbols-outlined">close</span>
			</button>
		</div>

		<!-- Content (Matching Design Language) -->
		<div class="carousel-content" @click.self="close()" @wheel.prevent="handleWheel">
			<button class="btn-icon carousel-nav prev" @click="prev()" x-show="currentIndex > 0 || document.getElementById('prev-page-btn')">
				<span class="material-symbols-outlined">chevron_left</span>
			</button>
			
			<template x-for="img in [images[currentIndex]]" :key="img ? img.id : 'empty'">
				<img x-show="img" :src="img?.src" class="carousel-image" 
					x-transition:enter="carousel-fade-active"
					x-transition:enter-start="carousel-fade-from"
					x-transition:enter-end="carousel-fade-to"
					x-transition:leave="carousel-fade-active"
					x-transition:leave-start="carousel-fade-to"
					x-transition:leave-end="carousel-fade-from"
					@load="isLoading = false"
					@click.stop=""
					@dblclick.stop="resetZoom()"
					@mousedown="startDrag"
					@mousemove.window="doDrag"
					@mouseup.window="stopDrag"
					:style="`transform: translate(${panX}px, ${panY}px) scale(${scale}); cursor: ${scale > 1 ? (isDragging ? 'grabbing' : 'grab') : 'default'}`">
			</template>
			
			<div x-show="isLoading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 5;">
				<svg class="md3-spinner" viewBox="0 0 48 48">
					<circle class="md3-spinner-path" cx="24" cy="24" r="18" fill="none" stroke-width="5"></circle>
				</svg>
			</div>
			
			<button class="btn-icon carousel-nav next" @click="next()" x-show="currentIndex < images.length - 1 || document.getElementById('next-page-btn')">
				<span class="material-symbols-outlined">chevron_right</span>
			</button>
		</div>

		<!-- Counter (Matching Design Language) -->
		<div class="carousel-counter">
			<span x-text="currentIndex + 1"></span> / <span x-text="images.length"></span>
		</div>
	</dialog>
	</body>
</html>
