<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="utf-8">
		<title>Acuity</title>
		<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
		<link rel="stylesheet" href="/static/css/style.css?v=3">
		
		<!-- HTMX & Alpine.js -->
		<script src="https://unpkg.com/htmx.org@1.9.10"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
	</head>

	<body x-data="{ showDetailPanel: false, currentGallery: '', path: '', showBrowser: false, selectedImages: [], deleteFromDisk: false }"
		  x-init="let saved = localStorage.getItem('openGallery'); if (saved) { currentGallery = saved; localStorage.removeItem('openGallery'); setTimeout(() => { htmx.ajax('GET', '/gallery/' + saved, {target: '#main-content'}) }, 100); }"
		  @load-gallery.window="localStorage.setItem('openGallery', $event.detail.value); window.location.reload()">
		<div class="layout-wrapper">
			<aside class="sidebar-left">
				<a href="/" style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; text-decoration: none; cursor: pointer;">
					<img src="/static/logo.svg" alt="Acuity Logo" style="width: 32px; height: 32px;">
					<h1 style="color: var(--primary);">Acuity</h1>
				</a>
				<hr>
				<nav style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1;">
					<div x-data="{ open: true }">
						<button class="nav-item" @click="open = !open">
							<span class="material-symbols-outlined">grid_view</span> Galleries
							<span class="material-symbols-outlined" style="margin-left: auto; font-size: 1rem;" x-text="open ? 'expand_less' : 'expand_more'">expand_less</span>
						</button>
						<div x-show="open" style="padding-left: 28px; display: flex; flex-direction: column; gap: 4px; margin-top: 4px;" x-transition>
							{{range .Galleries}}
							<div style="position: relative; display: flex; align-items: center;" x-data="{ hovered: false }" @mouseenter="hovered = true" @mouseleave="hovered = false">
								<button class="nav-item" :class="{ 'active': currentGallery === '{{.Name}}' }" @click="currentGallery = '{{.Name}}'" hx-get="/gallery/{{.Name}}" hx-target="#main-content" style="padding-right: 40px; flex-grow: 1;">
									<span class="material-symbols-outlined" style="font-size: 1rem;">folder</span> {{.Name}}
								</button>
								<button class="btn-icon" x-show="hovered" x-transition style="position: absolute; right: 8px; color: var(--danger); z-index: 10;"
										hx-delete="/gallery/{{.Name}}" 
										hx-confirm="Do you really want to delete '{{.Name}}'?"
										hx-target="closest div" 
										hx-swap="outerHTML">
									<span class="material-symbols-outlined" style="font-size: 1rem;">delete</span>
								</button>
							</div>
							{{end}}

							<button class="nav-item" @click="document.getElementById('addDialog').showModal()" style="padding: 6px 12px; font-size: 0.9rem; color: var(--primary);">
								<span class="material-symbols-outlined" style="font-size: 1rem;">add</span> Add Gallery
							</button>
						</div>
					</div>
					<div style="position: relative; display: flex; align-items: center;" x-data="{ hovered: false }" @mouseenter="hovered = true" @mouseleave="hovered = false">
						<button class="nav-item" hx-get="/gallery/global/duplicates" hx-target="#main-content">
							<span class="material-symbols-outlined">search</span> Duplicates
						</button>
					</div>
					<div id="sidebar-progress" hx-get="/api/progress" hx-trigger="every 1s" style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;"></div>

					<button class="nav-item" hx-get="/settings" hx-target="body" hx-swap="beforeend">
						<span class="material-symbols-outlined">settings</span> Settings
					</button>
				</nav>
			</aside>

			<main class="main-area" style="padding: 32px; overflow-y: auto;">
				<div id="main-content" style="min-height: 100%;">
					<div style="min-height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 20vh;">
						<h2 style="font-weight: normal; margin-bottom: 30px; color: var(--text-muted);">Search in your Images</h2>
						<div style="width: 100%; max-width: 600px;">
							{{template "search-bar" "global"}}
						</div>
						
						<!-- Hier landen die Suchergebnisse der Startseite -->
						<div id="gallery" class="gallery-grid" style="width: 100%; padding-top: 40px; align-self: flex-start;"></div>
					</div>
				</div>

				<aside class="sidebar-right" :class="{ 'is-open': showDetailPanel }" @click.outside="showDetailPanel = false">
					<button class="btn-icon" @click="showDetailPanel = false" style="align-self: flex-end; margin-bottom: 20px;">
						<span class="material-symbols-outlined">close</span>
					</button>
					<div id="info-container" style="overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column;">
						<!-- Hier lädt HTMX die Infos rein -->
					</div>
				</aside>
			</main>
		</div>



		<!-- Natives HTML Dialog -->
		<dialog x-ref="addDialog" id="addDialog" @click="if ($event.target === $el) { $el.classList.add('closing'); setTimeout(() => { $el.close(); $el.classList.remove('closing'); }, 300); }">
			<h3 style="margin-bottom: 20px;">Add a new Gallery</h3>
			<form id="form-id" hx-post="/gallery" hx-target="#main-content">
				<div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px;">
					<div>
						<label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; display: block;">Gallery Name</label>
						<input class="input-clean" type="text" name="name" required placeholder="Wallpaper">
					</div>
					<div class="form-group">
						<label>Absolute Gallery Path</label>

						<!-- Alpine x-model bindet die Eingabe an unsere Variable 'path' -->
						<div style="display: flex; gap: 8px;">
							<input class="input-clean" type="text" name="path" x-model="path" required style="flex-grow: 1;" placeholder="/data/wallpaper">

							<!-- Klick öffnet den Browser und lädt das Root-Verzeichnis via HTMX -->
							<button type="button" class="btn-icon" @click="showBrowser = true" hx-get="/api/browse?dir=/" hx-target="#file-browser-container">
								<span class="material-symbols-outlined">folder_open</span>
							</button>
						</div>

						<!-- Hier wird das "file-browser" Template reingeladen, wenn showBrowser = true ist -->
						<div x-show="showBrowser" id="file-browser-container" style="margin-top: 16px;" @click.outside="showBrowser = false">
						</div>
					</div>
				</div>
				<div style="display: flex; justify-content: flex-end; gap: 12px;">
					<button type="button" class="nav-item" style="width: auto;" @click="$refs.addDialog.classList.add('closing'); setTimeout(() => { $refs.addDialog.close(); $refs.addDialog.classList.remove('closing'); }, 300)">Cancel</button>
					<button type="submit" class="btn-primary" @click="$refs.addDialog.classList.add('closing'); setTimeout(() => { $refs.addDialog.close(); $refs.addDialog.classList.remove('closing'); }, 300)">Save</button>
				</div>
			</form>
		</dialog>

		<!-- Fullscreen Carousel -->
		<dialog x-ref="carouselDialog" class="carousel-modal" x-data="{
			images: [],
			currentIndex: 0,
			showInfo: false,
			scale: 1,
			panX: 0,
			panY: 0,
			isDragging: false,
			startX: 0,
			startY: 0,
			
			resetZoom() {
				this.scale = 1;
				this.panX = 0;
				this.panY = 0;
			},
			
			open(id) {
				const imageEls = Array.from(document.querySelectorAll('#main-content .image-card img'));
				this.images = imageEls.map(img => ({ src: img.src, id: img.dataset.id, rating: parseInt(img.dataset.rating) || 0 }));
				
				const idx = this.images.findIndex(img => img.id === id);
				this.currentIndex = idx !== -1 ? idx : 0;
				
				this.resetZoom();
				this.showInfo = false;
				this.$refs.carouselDialog.showModal();
				document.body.style.overflow = 'hidden';
			},
			
			close() {
				this.$refs.carouselDialog.close();
				document.body.style.overflow = '';
			},
			
			next() {
				if (this.currentIndex < this.images.length - 1) {
					this.currentIndex++;
					this.resetZoom();
					if(this.showInfo) {
						htmx.ajax('GET', '/image/' + this.images[this.currentIndex].id, {target: '#carousel-info-container'});
					}
				}
			},
			
			prev() {
				if (this.currentIndex > 0) {
					this.currentIndex--;
					this.resetZoom();
					if(this.showInfo) {
						htmx.ajax('GET', '/image/' + this.images[this.currentIndex].id, {target: '#carousel-info-container'});
					}
				}
			},
			
			handleWheel(e) {
				e.preventDefault();
				const delta = e.deltaY > 0 ? -0.1 : 0.1;
				this.scale = Math.max(1, Math.min(this.scale + delta * this.scale, 5));
				
				const img = this.$el.querySelector('.carousel-image');
				if (img) {
					const scaledWidth = img.clientWidth * this.scale;
					const scaledHeight = img.clientHeight * this.scale;
					const maxPanX = Math.max(0, (scaledWidth - window.innerWidth) / 2);
					const maxPanY = Math.max(0, (scaledHeight - window.innerHeight) / 2);
					this.panX = Math.max(-maxPanX, Math.min(maxPanX, this.panX));
					this.panY = Math.max(-maxPanY, Math.min(maxPanY, this.panY));
				}
			},
			
			startDrag(e) {
				if (this.scale <= 1) return;
				e.preventDefault();
				this.isDragging = true;
				this.startX = e.clientX - this.panX;
				this.startY = e.clientY - this.panY;
			},
			
			doDrag(e) {
				if (!this.isDragging) return;
				
				let newPanX = e.clientX - this.startX;
				let newPanY = e.clientY - this.startY;
				
				const img = this.$el.querySelector('.carousel-image');
				if (img) {
					const scaledWidth = img.clientWidth * this.scale;
					const scaledHeight = img.clientHeight * this.scale;
					
					const maxPanX = Math.max(0, (scaledWidth - window.innerWidth) / 2);
					const maxPanY = Math.max(0, (scaledHeight - window.innerHeight) / 2);
					
					newPanX = Math.max(-maxPanX, Math.min(maxPanX, newPanX));
					newPanY = Math.max(-maxPanY, Math.min(maxPanY, newPanY));
				}
				
				this.panX = newPanX;
				this.panY = newPanY;
			},
			
			stopDrag() {
				this.isDragging = false;
			}
		}"
		@open-carousel.window="open($event.detail.id)"
		@close-carousel.window="close()"
		@keydown.window.escape="if(showInfo) showInfo = false; else close()"
		@keydown.window.arrow-right="if($refs.carouselDialog.open) next()"
		@keydown.window.arrow-left="if($refs.carouselDialog.open) prev()"
		@rating-updated.window="let img = images.find(i => i.id === $event.detail.id); if(img) img.rating = $event.detail.rating;">
		
			<!-- Toolbar -->
			<div class="carousel-toolbar" x-show="images.length > 0">
				<div class="carousel-action" x-show="images[currentIndex]?.rating > 0" style="padding: 0 12px; width: auto; gap: 4px; font-weight: bold;">
					<span class="material-symbols-outlined icon-filled" style="color: var(--primary); font-size: 1.2rem;">star</span>
					<span x-text="images[currentIndex]?.rating"></span>
				</div>
				<button class="carousel-action" title="Select image" @click="let id = images[currentIndex].id; if(selectedImages.includes(id)) { selectedImages = selectedImages.filter(x => x !== id) } else { selectedImages.push(id) }" :style="selectedImages.includes(images[currentIndex].id) ? 'color: var(--primary);' : ''">
					<span class="material-symbols-outlined" x-text="selectedImages.includes(images[currentIndex].id) ? 'check_circle' : 'radio_button_unchecked'"></span>
				</button>
				<button class="carousel-action" title="Details" @click="showInfo = !showInfo; if(showInfo) { htmx.ajax('GET', '/image/' + images[currentIndex].id, {target: '#carousel-info-container'}) }">
					<span class="material-symbols-outlined">info</span>
				</button>
				<button class="carousel-action" title="Close fullscreen" @click="close()">
					<span class="material-symbols-outlined">close</span>
				</button>
			</div>
			
			<!-- Info Overlay -->
			<div x-show="showInfo" style="position: absolute; right: 20px; top: 70px; width: 350px; background: var(--bg-light); border: 1px solid var(--border); border-radius: 8px; padding: 16px; z-index: 10; max-height: calc(100vh - 100px); overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5);" x-transition>
				<div id="carousel-info-container"></div>
			</div>
			
			<div class="carousel-content" @click.self="if(showInfo) showInfo = false; else close()">
				<button class="btn-icon carousel-nav prev" @click="prev()" x-show="currentIndex > 0">
					<span class="material-symbols-outlined">chevron_left</span>
				</button>
				
				<template x-if="images.length > 0">
					<img :src="images[currentIndex].src" class="carousel-image" 
						@click.stop=""
						@dblclick.stop="resetZoom()"
						@wheel="handleWheel"
						@mousedown="startDrag"
						@mousemove.window="doDrag"
						@mouseup.window="stopDrag"
						:style="`transform: translate(${panX}px, ${panY}px) scale(${scale}); cursor: ${scale > 1 ? (isDragging ? 'grabbing' : 'grab') : 'default'}; transition: ${isDragging ? 'none' : 'transform 0.1s ease-out'}`">
				</template>
				
				<button class="btn-icon carousel-nav next" @click="next()" x-show="currentIndex < images.length - 1">
					<span class="material-symbols-outlined">chevron_right</span>
				</button>
			</div>
			
			<div class="carousel-counter">
				<span x-text="currentIndex + 1"></span> / <span x-text="images.length"></span>
			</div>
		</dialog>
	</body>
</html>
