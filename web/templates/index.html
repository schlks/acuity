<!DOCTYPE html>
<html lang="de">
	<head>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
		<link rel="stylesheet" href="/static/css/style.css">
		<script type="importmap">
			{
				"imports": {
				"@material/web/": "https://esm.run/@material/web/"
				}
			}
		</script>
		<script type="module">
		import '@material/web/all.js';
		import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';

		document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
		</script>
		<!-- HTMX & Alpine.js -->
		<script src="https://unpkg.com/htmx.org@1.9.10"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
	</head>

	<body x-data="{ showDetailPanel: false }">
		<div class="layout-wrapper">
			<aside class="sidebar-left">
			<h1 style="color: var(--primary);">Acuity</h1>

			<nav style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
				<md-text-button hx-get="/gallery/main" hx-target="#main-content">Gallery</md-text-button>
				<md-text-button hx-get="/settings" hx-target="#main-content">Settings</md-text-button>
				<md-text-button @click="$refs.dialog.show()">
					<md-icon slot="icon">create_new_folder</md-icon>
					Add Gallery
				</md-text-button>
			</nav>
		</aside>

		<main class="main-area">
			<div id="main-content" class="center-search-container">
				<h2 style="font-weight: normal; margin-bottom: 30px;">Searc in Gallery</h2>

				{{template "search-bar"}}
			</div>
		</main>

			<aside class="sidebar-right" :class="{ 'is-open': showDetailPanel }">
				<md-icon-button @click="showDetailPanel = false" style="align-self: flex-end; margin-bottom: 10px;">
					<md-icon>close</md-icon>
				</md-icon-button>
				<div id="info-container">
					<!-- Hier lädt HTMX die Infos rein -->
				</div>
			</aside>
		</div>

		<md-dialog x-ref="dialog">
			<div slot="headline">Add a new Gallery</div>
			<form slot="content" id="form-id" method="dialog" hx-post="/gallery" hx-target="#main-content">
				<div style="display: flex; flex-direction: column; gap: 15px; margin-top: 10px;">
					<md-outlined-text-field label="Gallery Name" name="name" required></md-outlined-text-field>
					<md-outlined-text-field label="Absolute Gallery Path" name="path" required placeholder="/images/your/data"></md-outlined-text-field>
				</div>
			</form>
			<div slot="actions">
				<md-text-button @click="$refs.dialog.close()">Cancel</md-text-button>
				<md-filled-button type="submit" form="form-id" @click="$refs.dialog.close()">Save</md-filled-button>
			</div>
		</md-dialog>

	</body>
</html>
