{{if .}}
<div style="display:none;" x-data x-init="$dispatch('update-imports', [
    {{range $index, $element := .}}
    { name: '{{$element.GalleryName}}', current: {{$element.Current}}, expected: {{$element.Expected}} },
    {{end}}
])"></div>
{{else}}
<div style="display:none;" x-data x-init="$dispatch('update-imports', [])"></div>
{{end}}
