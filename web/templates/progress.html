<div hx-get="/gallery/{{.GalleryName}}/progress" hx-trigger="every 1s" hx-target="#sidebar-progress" hx-swap="innerHTML" style="padding: 16px; background: var(--bg-light); border-radius: 8px; border: 1px solid var(--border); margin: 16px 0;">
    <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
        <span class="material-symbols-outlined" style="font-size: 1.1rem; animation: spin 2s linear infinite; color: var(--primary);">sync</span>
        Scanning {{.GalleryName}}
    </div>
    
    <div style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; font-weight: 500;">
        <span>Progress</span>
        <span style="color: var(--text);">{{.Current}} / {{.Expected}}</span>
    </div>
    
    <div style="width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; position: relative;">
        <div style="height: 100%; background: var(--primary); width: {{.Percent}}%; border-radius: 3px; transition: width 0.3s ease;"></div>
    </div>
</div>
