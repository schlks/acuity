{{if .}}
<div>
    {{range .}}
    <div style="padding: 16px; background: var(--bg-light); border-radius: 8px; border: 1px solid var(--border); margin: 16px 0;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span class="material-symbols-outlined" style="font-size: 1.1rem; animation: spin 2s linear infinite; color: var(--primary); display: block; line-height: 1;">sync</span>
                <span style="font-weight: 500; color: var(--text);">Importing {{.GalleryName}}...</span>
            </div>
            <span style="color: var(--text-muted); font-size: 0.9rem;">{{.Current}} / {{.Expected}}</span>
        </div>
        <div style="width: 100%; height: 6px; background: var(--bg-dark); border-radius: 3px; overflow: hidden;">
            <div style="height: 100%; background: var(--primary); width: {{.Percent}}%; transition: width 0.3s ease;"></div>
        </div>
    </div>
    {{end}}
</div>
{{end}}
