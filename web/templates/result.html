<style>
    /* Styling für die einzelnen Bild-Kacheln */
    .image-squircle {
        width: 100%;
        aspect-ratio: 16 / 9;
        background-color: var(--bg-overlay);
		border-radius: 20px;
        object-fit: cover;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .image-squircle:hover {
        transform: scale(1.03);
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
</style>

{{ range . }}
<img src="/image?path={{ .Path }}" 
     class="image-squircle" 
     alt="Suchergebnis"
     hx-get="/detail?path={{ .Path }}"
     hx-target="#detail-content"
     @click="showDetailPanel = true">
{{ else }}
<div style="color: var(--text-muted); grid-column: 1 / -1;">
    Keine Übereinstimmungen in der Datenbank gefunden.
</div>
{{ end }}
